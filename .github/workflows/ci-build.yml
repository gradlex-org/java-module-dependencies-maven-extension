name: Build Extension
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  MAVEN_HOME: "/usr/share/apache-maven-3.9.15"
jobs:
  gradle-build:
    runs-on: ubuntu-latest
    steps:
      - run: ls /usr/share | grep apache-maven
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
      - run: "./gradlew build -Psigning.disable"